name: Release

# Real release automation — cross-compiles for
# Windows/macOS/Linux and publishes a real GitHub Release with binaries
# attached on every version tag. This is the GitHub-Releases baseline
# channel; winget/Scoop/conda-forge publishing hooks onto this same
# tag-triggered flow later, same as gh CLI's own real pipeline.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gcli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gcli.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gcli
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gcli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p gcli
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf gcli-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: gcli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gcli-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
