[workspace]
resolver = "2"
members = [
    "crates/gcli",
    "crates/gcli-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["GeoIntellisense"]

[workspace.dependencies]
clap = { version = "4", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geojson = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
